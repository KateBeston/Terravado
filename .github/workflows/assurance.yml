name: Assurance

on:
  push:
    branches: [main, master]
  pull_request:

# Monorepo CI. Installs the whole workspace once, then runs the three gates that
# catch real regressions: the engine assurance checks, a typecheck of both apps,
# and a production build of each app. (Lint is omitted until an ESLint config is
# added — `next lint` with no config prompts interactively and fails in CI.)
jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install workspace
        run: npm ci
      - name: Engine assurance checks
        run: npm run verify
      - name: Typecheck (both apps)
        run: npm run typecheck
      - name: Build internal portal
        run: npm run build:portal
      - name: Build main site
        run: npm run build:main
